:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A221D; --ink:#E5ECE6; --muted:#98A49B; --line:#2C3830;

:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A221D; --ink:#E5ECE6; --muted:#98A49B; --line:#2C3830;
  --accent:#8DB4F0; --good:#4CC48A; --bad:#F27C70; --good-soft:#163024; --bad-soft:#3A1E1C; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em;margin:0}
.brand em{font-style:normal;color:var(--accent)}
.score{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink);font-size:1rem}
.dots{display:grid;gap:5px;list-style:none;margin:0;padding:0}
.dots li{height:6px;border-radius:3px;background:var(--line)}
.dots li.now{background:var(--accent)} .dots li.ok{background:var(--good)} .dots li.no{background:var(--bad)}

.stage{overflow-y:auto;min-height:0;padding-block:6px 14px;overscroll-behavior:contain}
.card{display:flex;flex-direction:column;gap:12px}
.meta{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.question{font-family:var(--f-head);font-weight:600;font-size:clamp(1.25rem,5.2vw,1.55rem);line-height:1.3;margin:0;text-wrap:balance}

.photo-box{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.photo{display:block;width:100%;aspect-ratio:3/2;max-height:40vh;object-fit:contain;border-radius:8px;background:var(--bg)}
.photo-msg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.review .thumb{width:52px;height:40px;object-fit:cover;border-radius:6px;background:var(--bg);vertical-align:middle}
.options{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.opt{width:100%;min-height:48px;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:12px;
  text-align:left;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  font-size:1rem;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (hover:hover){.opt:not([disabled]):hover{border-color:var(--accent)}}
.opt .key{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;
  background:var(--bg);color:var(--muted)}
.opt .txt{min-width:0;line-height:1.3}
.opt .res{font-weight:800;font-size:1.05rem}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);color:var(--surface)}
.opt.correct .res{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.wrong .res{color:var(--bad)}
.opt.faded{opacity:.5}

.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fact .verdict{font-weight:800;font-size:1.05rem;margin:0}
.fact .verdict.ok{color:var(--good)} .fact .verdict.no{color:var(--bad)}
.fact p{margin:0;font-family:var(--f-head);font-size:1rem;line-height:1.55}
.fact .credit{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.fact .credit a{color:inherit}

.over{display:flex;flex-direction:column;gap:16px}
.final{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.final .big{font-weight:800;font-size:3.2rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:0}
.final p{margin:0}
.final .best{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.review-title{font-size:.8rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0;font-weight:500}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.review li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto 52px 1fr;align-items:center;gap:12px}
.review .mark{font-weight:800;font-size:1.05rem;line-height:1.3}
.review .mark.ok{color:var(--good)} .review .mark.no{color:var(--bad)}
.review .q{font-family:var(--f-head);font-size:.95rem;line-height:1.35;min-width:0}
.review .ans{font-size:.9rem;color:var(--muted)}
.review .ans b{color:var(--ink);font-weight:600}

.actions{padding-block:10px 14px;border-top:1px solid var(--line);background:var(--bg)}
.btn{width:100%;border:none;border-radius:12px;min-height:58px;font-weight:700;font-size:1.1rem;cursor:pointer;
  background:var(--accent);color:var(--surface);transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:default;transform:none}
.foot{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-align:center;margin:8px 0 0}
.foot a{color:inherit}
.error{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:14px 16px;font-size:.92rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.fact{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
</style>

  {"breed": "Boston Terrier", "group": "Non-Sporting", "photo": "Boston-terrier-carlos-de.JPG", "fact": "Nicknamed 'the American Gentleman' for its tuxedo-like markings, it's one of only a few breeds that originated in the U.S."},
  {"breed": "Chow Chow", "group": "Non-Sporting", "photo": "IMG 0383 - Chow Chow, side.jpg", "fact": "An ancient breed from China, famous for its purple or blue-black tongue."},
  {"breed": "Shiba Inu", "group": "Non-Sporting", "photo": "Taka Shiba.jpg", "fact": "The smallest of Japan's six native breeds. A Shiba named Kabosu is the face of the 'Doge' meme."},
  {"breed": "Bichon Frise", "group": "Non-Sporting", "photo": "Bichon Frisé - studdogbichon.jpg", "fact": "Its coat is always pure white and curls in loose spirals. Bichons were favourites of European royal courts from the 1200s."},
  {"breed": "Keeshond", "group": "Non-Sporting", "photo": "Keeshond 2.JPG", "fact": "Once called the Dutch Barge Dog. It was the symbol of the Dutch Patriot faction in the 1700s and is named after the Patriot Cornelis 'Kees' de Gyselaer."},
  {"breed": "Schipperke", "group": "Non-Sporting", "photo": "Schipperke0001.jpg", "fact": "A Belgian breed from Flanders. Its name is often said to mean 'little captain', though it may mean 'little shepherd'."}
 ]
}
</script>

<div class="app">
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><em>Dog Breeds</em> Quiz</h1>
      <div class="score" id="scoreBox"></div>
    </div>
    <ol class="dots" id="dots" aria-hidden="true"></ol>
  </header>

  <main class="stage" id="stage">
    <section class="card" id="play">
      <div class="meta" id="cat"></div>
      <h2 class="question" id="question"></h2>
      <div class="photo-box"><img class="photo" id="photo" alt=""><div class="photo-msg" id="photoMsg" hidden></div></div>
      <ol class="options" id="options"></ol>
      <div class="fact" id="fact" hidden>
        <p class="verdict" id="verdict"></p>
        <p id="factText"></p>
        <p class="credit"><a id="credit" href="#" target="_blank" rel="noopener">Photo: Wikimedia Commons (author and licence)</a></p>
      </div>
    </section>

    <section class="over" id="over" hidden>
      <div class="final">
        <p class="big" id="finalScore"></p>
        <p id="finalMsg"></p>
        <p class="best" id="best"></p>
      </div>
      <h2 class="review-title">Your answers</h2>
      <ol class="review" id="review"></ol>
    </section>
  </main>

  <footer class="actions">
    <button class="btn" id="mainBtn" type="button" disabled>Pick an answer</button>
    <p class="foot" id="foot"></p>
  </footer>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<script>
// ---------- Load and check the content ----------
const $ = id => document.getElementById(id);
const KEYS = "ABCDEF";
let DATA, ITEMS = [], PER = 12, NOPT = 5;
const shuffle = a => { a = [...a]; for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

try {
  DATA = JSON.parse($("quiz-data").textContent);
  PER = Math.max(1, +(DATA.settings && DATA.settings.questionsPerGame) || 12);
  NOPT = Math.min(6, Math.max(3, +(DATA.settings && DATA.settings.optionsPerQuestion) || 5));
  (DATA.breeds || []).forEach((b, n) => {
    if (!b.breed || !b.photo) console.warn(`Breed ${n + 1} skipped: missing name or photo.`);
    else ITEMS.push(b);
  });
} catch (e) {
  console.error(e);
}

// Photos come straight from Wikimedia Commons. "width" asks Commons for a
// resized copy, so phones don't download the full-size original.
const photoSrc = (file, width) => "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(file) + "?width=" + width;
const photoPage = file => "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(file.replace(/ /g, "_"));

// Build a question with wrong answers taken from other breeds,
// preferring the same group so the choices are plausible.
function makeQuestion(b) {
  const others = ITEMS.filter(o => o.breed !== b.breed);
  const same = shuffle(others.filter(o => o.group === b.group).map(o => o.breed));
  const rest = shuffle(others.filter(o => o.group !== b.group).map(o => o.breed));
  const wrong = [...new Set([...same, ...rest])].slice(0, NOPT - 1);
  return { category: b.group ? b.group + " group" : "Dogs", q: "Which breed is this dog?", photo: b.photo,
           answer: b.breed, options: [b.breed, ...wrong], fact: b.fact };
}

// ---------- Game ----------
let round = [], i = 0, score = 0, answers = [], picked = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const total = () => round.length;

function header() {
  const done = !$("over").hidden;
  $("scoreBox").innerHTML = done ? `Done · Score <b>${score}</b>`
    : `Q <b>${Math.min(i + 1, total())}</b>/${total()} · Score <b>${score}</b>`;
  $("dots").style.gridTemplateColumns = `repeat(${total()},1fr)`;
  $("dots").innerHTML = round.map((_, k) => {
    const c = k < answers.length ? (answers[k].ok ? "ok" : "no") : (k === i && !done ? "now" : "");
    return `<li class="${c}"></li>`;
  }).join("");
}

// Show the photo, with a message while it loads or if it fails.
function setPhoto(x) {
  const img = $("photo"), msg = $("photoMsg"), at = i;
  msg.textContent = "Fetching the photo…"; msg.hidden = false;
  img.onload = () => { if (at === i) msg.hidden = true; };
  img.onerror = () => { if (at === i) msg.textContent = "This photo wouldn't load. Pick any answer to move on."; };
  img.src = photoSrc(x.photo, 1200);
}

function show() {
  const x = round[i];
  picked = false;
  x._order = shuffle(x.options);
  $("cat").textContent = x.category;
  setPhoto(x);
  $("question").textContent = x.q;
  $("options").innerHTML = x._order.map((o, k) =>
    `<li><button class="opt" type="button" id="opt-${k}" data-v="${esc(o)}"><span class="key">${KEYS[k]}</span><span class="txt">${esc(o)}</span><span class="res" aria-hidden="true"></span></button></li>`
  ).join("");
  $("fact").hidden = true;
  const b = $("mainBtn"); b.disabled = true; b.textContent = "Pick an answer";
  $("stage").scrollTop = 0;
  header();
}

function choose(value) {
  if (picked) return;
  picked = true;
  const x = round[i], ok = value === x.answer;
  if (ok) score++;
  answers.push({ x, value, ok });
  buzz(ok ? 20 : [30, 40, 30]);

  document.querySelectorAll(".opt").forEach(btn => {
    const v = btn.dataset.v; btn.disabled = true;
    if (v === x.answer) { btn.classList.add("correct"); btn.querySelector(".res").textContent = "✓"; }
    else if (v === value) { btn.classList.add("wrong"); btn.querySelector(".res").textContent = "✗"; }
    else btn.classList.add("faded");
  });

  const vd = $("verdict");
  vd.textContent = ok ? "Correct!" : `Not quite. It's a ${x.answer}.`;
  vd.className = "verdict " + (ok ? "ok" : "no");
  $("factText").textContent = x.fact || "";
  $("factText").hidden = !x.fact;
  $("credit").href = photoPage(x.photo);
  $("fact").hidden = false;
  $("live").textContent = vd.textContent + " " + (x.fact || "");

  const b = $("mainBtn");
  b.disabled = false;
  b.textContent = i === total() - 1 ? "See your results →" : "Next question →";
  b.focus({ preventScroll: true });
  header();
  requestAnimationFrame(() => $("fact").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" }));
}

function finish() {
  $("play").hidden = true; $("over").hidden = false;
  const n = total(), pct = score / n;
  $("finalScore").textContent = `${score}/${n}`;
  $("finalMsg").textContent = pct >= .9 ? "Outstanding. Best in show." : pct >= .7 ? "Great result. A true dog lover." : pct >= .5 ? "Solid effort. Have another go." : "A tough set. Every round is different, so try again.";
  let best = score;
  try { const key = "dogs-best-" + (DATA.version || "1"); best = Math.max(score, +(localStorage.getItem(key) || 0)); localStorage.setItem(key, best); } catch (e) {}
  $("best").textContent = `Best score on this device: ${best}/${n}`;
  $("review").innerHTML = answers.map(a =>
    `<li><span class="mark ${a.ok ? "ok" : "no"}" aria-label="${a.ok ? "correct" : "wrong"}">${a.ok ? "✓" : "✗"}</span><img class="thumb" src="${esc(photoSrc(a.x.photo, 160))}" alt="Photo of a ${esc(a.x.answer)}">
     <span class="ans">${a.ok ? `<b>${esc(a.x.answer)}</b>` : `You said ${esc(a.value)} · answer: <b>${esc(a.x.answer)}</b>`}</span></li>`
  ).join("");
  const b = $("mainBtn"); b.disabled = false; b.textContent = "Play again ↻"; b.focus({ preventScroll: true });
  $("stage").scrollTop = 0;
  header();
}

function start() {
  round = shuffle(ITEMS).slice(0, Math.min(PER, ITEMS.length)).map(makeQuestion);
  i = 0; score = 0; answers = [];
  $("over").hidden = true; $("play").hidden = false;
  round.slice(1).forEach(x => { new Image().src = photoSrc(x.photo, 1200); });   // preload the rest of the round
  show();
}

$("options").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(b.dataset.v); });
$("mainBtn").addEventListener("click", () => {
  if (!$("over").hidden) start();
  else if (picked) { if (i < total() - 1) { i++; show(); } else finish(); }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "A") return;
  const k = e.key.toUpperCase(), idx = KEYS.indexOf(k);
  if (!picked && $("over").hidden && idx > -1 && idx < (round[i]?._order.length || 0) && k.length === 1) { e.preventDefault(); choose(round[i]._order[idx]); }
  else if (e.key === "Enter" && !$("mainBtn").disabled && document.activeElement !== $("mainBtn")) { e.preventDefault(); $("mainBtn").click(); }
});

if (ITEMS.length >= 5) {
  $("foot").textContent = `${ITEMS.length} breeds · photos and facts from Wikimedia Commons and Wikipedia · version ${DATA.version || "1"}`;
  start();
} else {
  $("play").innerHTML = `<div class="error">The quiz content couldn't be loaded. Check the quiz-data block for a JSON typo, such as a missing comma or quote.</div>`;
  $("mainBtn").textContent = "No questions loaded";
}
</script>
</body>
</html>
